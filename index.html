<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALX.TATT Cotizador</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Hairline&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --negro-profundo: #0d0d0d;
            --gris-oscuro: #1a1a1a;
            --rojo-tinta: #e63946;
            --texto: #f1f1f1;
            --borde: #333;
        }

        body {
            background-color: var(--negro-profundo);
            color: var(--texto);
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: var(--gris-oscuro);
            padding: 30px;
            border-radius: 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid var(--borde);
        }

        h1 {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 30px;
            color: var(--rojo-tinta);
        }

        label {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 8px;
            display: block;
        }

        input, select {
            width: 100%;
            background: #111;
            border: 1px solid var(--borde);
            padding: 15px;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            margin-bottom: 20px;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--rojo-tinta); }

        .btn-calc {
            background: var(--rojo-tinta);
            color: white;
            width: 100%;
            padding: 18px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(230, 57, 70, 0.3);
        }

        .btn-reset {
            background: transparent;
            color: #666;
            margin-top: 15px;
            width: 100%;
            border: none;
            font-size: 0.9rem;
            cursor: pointer;
        }

        #resultado {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px dashed var(--borde);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .inv-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            align-items: center;
            background: #111;
            padding: 10px;
            border-radius: 10px;
        }

        /* --- ESTILOS DE GALERÍA OPTIMIZADOS --- */
        .galeria-container {
            margin-top: 40px;
            text-align: center;
        }

        .galeria-flex {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            padding: 10px;
        }

        .foto-placeholder {
            width: 140px;
            height: 180px;
            background: #111;
            border: 1px solid var(--borde);
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            transition: 0.3s ease;
            cursor: pointer;
        }

        .foto-placeholder:hover {
            border-color: var(--rojo-tinta);
            transform: translateY(-8px);
            box-shadow: 0 0 15px rgba(230, 57, 70, 0.4);
        }

        .foto-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.3s;
        }

        .foto-placeholder span {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            padding: 15px 10px 10px;
            color: white;
            font-size: 0.65rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
            z-index: 2;
        }
/* --- NUEVOS ESTILOS PARA LA TARJETA INSTAGRAMEABLE --- */

/* Contenedor principal del Ticket */
.ticket-quote {
    background: #000000; /* Negro profundo para máximo contraste */
    padding: 30px;
    border-radius: 20px;
    /* Borde fino y minimalista inspirado en la opción Minimal (ahora blanco) */
    border: 1px solid #ffffff; 
    text-align: center;
    position: relative;
    margin-top: 20px;
    box-sizing: border-box; /* Asegura que el padding no rompa el borde */
}

/* 2. TEXTO GENERAL: Todo blanco */
.ticket-quote,
.ticket-quote span,
.ticket-details,
.ticket-footer {
    color: #ffffff; /* Forzamos color blanco en todo el ticket */
    font-family: 'Inter', sans-serif;
}

/* 3. EL PRECIO: Único elemento Rojo con Brillo Neón */
.ticket-price {
    font-family: 'Bungee Hairline', sans-serif;
    font-size: 4rem; /* ¡Más grande! */
    font-weight: 400;
    margin: 10px 0;
    line-height: 1;
    
    /* CAMBIO CLAVE: Color Rojo Neón Tinta */
    color: var(--rojo-tinta);
    /* Efecto Neón Rojo Triple (más profundo) */
    text-shadow: 0 0 10px rgba(230, 57, 70, 0.7), 
                0 0 20px rgba(230, 57, 70, 0.5);
}

/* 4. DETALLES (Estilo y Tamaño): Blanco y Nítido */
.ticket-details {
    text-transform: uppercase;
    letter-spacing: 4px;
    font-size: 0.7rem;
    margin-top: 10px;
    font-weight: 700;
}

/* 5. EL DIVISOR: Línea punteada blanca y fina */
.ticket-divider {
    border: none;
    border-top: 1px dashed #ffffff; /* Ahora blanca y fina */
    margin: 25px 0;
}

/* 6. PIE DE TICKET: Blanco y nítido */
.ticket-footer {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 2px;
}

/* Botones dentro de la tarjeta al cotizar */
.btn-ticket-group {
    margin-top: 25px;
    display: flex;
    gap: 10px;
    justify-content: center;
}

.btn-download {
    background: #ffffff; /* Blanco para contrastar */
    color: #000000;
    padding: 10px 20px;
    border-radius: 50px;
    font-size: 0.7rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: 0.3s;
}
.btn-download:hover { background: #cccccc; }
        
        
    </style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
</head>
<body>

    <div class="card">
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="logo2026.png" alt="Logo Estudio" style="max-width: 120px; height: auto;">
        </div>
        <h1>Cotizador Estudio</h1>
        
        <label>Tamaño (5cm - 50cm):</label>
        <input type="number" id="tamaño" placeholder="Ej: 15" min="5" max="50">

        <label>Complejidad / Estilo:</label>
        <select id="complejidad">
            <option value="1">Baja (Solo líneas)</option>
            <option value="1.5">Media (Sombras / Detalle)</option>
            <option value="2">Alta (Realismo / Full Color)</option>
        </select>

        <div class="btn-group">
            <button class="btn-calc" onclick="calcular()">COTIZAR</button>
            <button class="btn-reset" onclick="reinicio()">LIMPIAR</button>
        </div>

        <div id="resultado" style="display:none;"></div>

        <div id="seccion-reserva" style="display:none; margin-top:20px;">
            <label>Elegí tu horario:</label>
            <select id="hora-turno">
                <option value="11:00">Mañana (11:00 AM)</option>
                <option value="14:00">Tarde 1 (02:00 PM)</option>
                <option value="17:00">Tarde 2 (05:00 PM)</option>
            </select>
            
            <label>Tu Nombre:</label>
            <input type="text" id="nombre-cliente" placeholder="Nombre completo">
            <label>WhatsApp:</label>
            <input type="tel" id="tel-cliente" placeholder="Ej: 1123456789">
            
            <button class="btn-calc" onclick="guardarTurno()" style="background: #25d366;">RESERVAR TURNO</button>
        </div>
        
        <div class="galeria-container">
            <h2>Mis Trabajos</h2>
            <div id="galeria-dinamica" class="galeria-flex">
                <p style="color:#444;">Sincronizando portfolio...</p>
            </div>
        </div>
        
        <hr style="margin-top:50px; border: 0.5px solid #333;">
        <button onclick="abrirPanelArtista()" style="background:none; border:none; color:#444; width:100%; cursor:pointer;">⚙ Acceso Artista</button>

        <div id="panel-artista" style="display:none; background:#111; padding:20px; border-radius:15px; margin-top:20px;">
            <h3>Gestión de Insumos</h3>
            <div id="lista-inventario"></div>
            <button class="btn-calc" onclick="enviarDescuentoStock()" style="margin-top:20px; background:#444;">DESCONTAR DEL EXCEL</button>
        </div>
    </div>

    <script>
        // --- VARIABLES DE ESTADO ---
        let datosCargados = { precios: {}, inventario: [], turnos: [], galeria: [] };
        let totalCalculado = 0;
        let estiloNombre = ""; 
        let cargando = false; 
        const MI_PIN = "1234"; 
        
        // --- TU URL REAL ---
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxPt9JcsqYVTzYih1O_KBMHuwh4SmPRzVLzGSPIFQRij606SmFC2cGCPXUgTfyPui8-/exec";

        // 1. CARGAR DATOS DESDE EL EXCEL
        async function cargarDatos() {
            if (cargando) return;
            cargando = true;
            try {
                const res = await fetch(URL_SCRIPT + "?v=" + Date.now());
                const data = await res.json();
                
                datosCargados = {
                    precios: data.precios || {},
                    inventario: data.inventario || [],
                    turnos: data.turnos || [],
                    galeria: data.galeria || []
                };

                // Dibujamos la galería con los datos del Excel
                dibujarGaleria(datosCargados.galeria);

            } catch (e) {
                console.error("Error sincronizando:", e);
                document.getElementById('galeria-dinamica').innerHTML = "<p style='color:red;'>Error al conectar con la galería.</p>";
            } finally {
                cargando = false;
            }
        }

        // 2. DIBUJAR LA GALERÍA DINÁMICAMENTE
        // 1. MEJORA: Galería Interactiva
function dibujarGaleria(lista) {
    const contenedor = document.getElementById('galeria-dinamica');
    contenedor.innerHTML = ""; 

    if (!lista || lista.length === 0) {
        contenedor.innerHTML = "<p style='color:#666;'>No hay trabajos cargados.</p>";
        return;
    }

    lista.forEach(trabajo => {
        const ficha = document.createElement('div');
        ficha.className = 'foto-placeholder';
        
        // --- NUEVA LÓGICA DE CLIC ---
        // Dentro de dibujarGaleria, en la parte de ficha.onclick:
        
ficha.onclick = () => {
    const selector = document.getElementById('complejidad');
    const inputTam = document.getElementById('tamaño');
    
    // Convertimos el estilo a minúsculas para que no haya errores de dedo
    const estiloTxt = trabajo.estilo.toLowerCase();

    // --- NUESTRO TRADUCTOR DE ESTILOS ---
    const mapaComplejidad = {
        "realismo": "2",
        "full color": "2",
        "neo tradicional": "2",
        "blackwork": "1.5",
        "puntillismo": "1.5",
        "linea fina": "1",
        "tradicional": "2"
    };

    // Buscamos el valor en el traductor. Si no existe, por defecto ponemos "1" (Baja)
    selector.value = mapaComplejidad[estiloTxt] || "1";
    
    // Efectos de UX
    inputTam.focus();
    window.scrollTo({ top: 0, behavior: 'smooth' });
};

        const imagen = document.createElement('img');
        imagen.src = trabajo.url || "https://via.placeholder.com/150"; 
        
        const texto = document.createElement('span');
        texto.innerText = `${trabajo.estilo} (${trabajo.tamano || '?'})`;
        
        ficha.appendChild(imagen);
        ficha.appendChild(texto);
        contenedor.appendChild(ficha);
    });
}

        // 3. INICIO AUTOMÁTICO
        window.addEventListener('DOMContentLoaded', cargarDatos);

        // --- FUNCIONES DE CÁLCULO Y RESERVA ---
        async function calcular() {
    const tam = parseFloat(document.getElementById('tamaño').value);
    const selector = document.getElementById('complejidad');
    const comp = parseFloat(selector.value);
    
    let fullText = selector.options[selector.selectedIndex].text;
    let match = fullText.match(/\(([^)]+)\)/);
    estiloNombre = match ? match[1] : fullText;

    // Validación de seguridad básica
    if (isNaN(tam) || tam < 5) return alert("⚠️ Ingresá un tamaño válido (mín. 5cm)");

    const precios = datosCargados.precios;
    if(!precios.baja) return alert("☕ Cargando precios, esperá un segundo...");

    // Lógica de cálculo (la misma)
    let base = (comp == 1) ? precios.baja : precios.mediaAlta;
    let extra = (tam < 15) ? 0 : Math.ceil((tam - 15) / 5) * 40000;
    totalCalculado = base + extra;

    const resDiv = document.getElementById('resultado');
    
    // --- NUEVO DISEÑO DEL TICKET (HTML Dinámico) ---
    resDiv.innerHTML = `
        <div id="tarjeta-downloadable" class="ticket-quote">
            <img src="logo2026.png" style="width: 60px; margin-bottom:10px;">
            <div style="font-size:0.65rem; color:#ffffff; text-transform:uppercase; letter-spacing:2px; font-weight:700;">
                ALX.TATT ESTUDIO
            </div>
            
            <h2 class="ticket-price">$${totalCalculado.toLocaleString()}</h2>
            
            <p class="ticket-details">${estiloNombre} • ${tam}CM</p>
            
            <hr class="ticket-divider">
            
            <div class="ticket-footer">
                ALX.TATT ESTUDIO • VILLA DEL PARQUE<br>
                VÁLIDO POR 30 DÍAS • SUJETO A CAMBIOS
                
                <img src="logo2026.png" style="width: 1px; height: 1px; opacity: 0; position: absolute; bottom: 0; left: 0;">
            </div>
        </div>

        <div class="btn-ticket-group" style="margin-top: 25px;">
            <button onclick="descargarCotizacion()" class="btn-download">⬇️ DESCARGAR IMAGEN</button>
        </div>
    `;
    
    resDiv.style.display = "block";
    document.getElementById('seccion-reserva').style.display = "block";
}

        function prepararCaptura() {
            document.getElementById('btn-foto').style.display = 'none';
            document.getElementById('seccion-reserva').style.display = 'none';
            alert("¡Lista para captura! Tocá cualquier lado para volver.");
            window.onclick = function() {
                document.getElementById('btn-foto').style.display = 'inline-block';
                document.getElementById('seccion-reserva').style.display = 'block';
                window.onclick = null;
            };
        }

        async function guardarTurno() {
    // 1. Primero atrapamos los datos que escribió el cliente
    const nombre = document.getElementById('nombre-cliente').value.trim();
    const whatsapp = document.getElementById('tel-cliente').value.trim();
    const tam = document.getElementById('tamaño').value;
    const hora = document.getElementById('hora-turno').value;

    // --- AQUÍ VA EL PASO 1: LOS GUARDIAS DE SEGURIDAD ---

    // Guardia A: ¿Puso su nombre?
    if (!nombre) return alert("⚠️ Por favor, ingresá tu nombre.");

    // Guardia B: ¿El WhatsApp tiene 10 números? 
    // (Ejemplo: 1123456789 - Sin el 0 ni el 15)
    const moldeCelular = /^\d{10}$/; 
    if (!moldeCelular.test(whatsapp)) {
        return alert("⚠️ El WhatsApp debe tener 10 números (ej: 1123456789). No uses espacios, guiones, ni el 0 o 15 inicial.");
    }

    // --- SI PASÓ LOS GUARDIAS, RECIÉN AHÍ HACEMOS EL ENVÍO ---
    try {
        await fetch(URL_SCRIPT, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({
                accion: "reservar", 
                nombre, whatsapp, tam, hora, 
                comp: estiloNombre, total: totalCalculado 
            })
        });

        alert("✅ ¡Turno agendado!");
        
        // Redirigir a WhatsApp para cerrar la venta
        const mensaje = `Hola! Soy ${nombre}, coticé un ${estiloNombre} de ${tam}cm ($${totalCalculado.toLocaleString()}). Quiero agendar para las ${hora}!`;
        window.location.href = `https://wa.me/1157734552?text=${encodeURIComponent(mensaje)}`;
        
    } catch (e) { 
        alert("❌ Error al conectar. Intentá de nuevo."); 
    }
}

        // --- PANEL DE ARTISTA ---
        function abrirPanelArtista() {
            if (prompt("PIN de Artista:") !== MI_PIN) return alert("PIN Incorrecto");
            document.getElementById('panel-artista').style.display = "block";
            renderizarPanel();
        }

        function renderizarPanel() {
            let htmlTurnos = "<h4>Turno terminado:</h4>";
            htmlTurnos += "<select id='select-turno' style='width:100%; padding:10px; background:#222; color:white; border-radius:10px;'>";
            datosCargados.turnos.forEach(t => {
                htmlTurnos += `<option value="${t.fila}">${t.cliente.toUpperCase()} (${t.detalle})</option>`;
            });
            htmlTurnos += "</select>";

            let htmlInv = "<h4>Insumos usados:</h4>";
            datosCargados.inventario.forEach((item, i) => {
                htmlInv += `
                <div class="inv-item">
                    <span>${item.nombre} (Stock: ${item.stock})</span>
                    <input type="number" id="inv-${i}" value="0" style="width:50px; background:#000; color:#0ff; border:1px solid #333; text-align:center;">
                </div>`;
            });
            document.getElementById('lista-inventario').innerHTML = htmlTurnos + htmlInv;
        }

        // 2. MEJORA: Validación de Seguridad (Capa de Protección)
async function enviarDescuentoStock() {
    const filaTurno = document.getElementById('select-turno').value;
    
    // --- EL CANDADO ---
    if (!filaTurno) {
        return alert("⚠️ ERROR: Tenés que seleccionar qué cliente terminó para poder descontar el stock.");
    }

    const btn = event.target;
    btn.innerText = "Sincronizando...";
    btn.disabled = true;

    let items = [];
    datosCargados.inventario.forEach((item, i) => {
        let cant = parseInt(document.getElementById(`inv-${i}`).value);
        if(cant > 0) items.push({ fila: item.fila, cantidad: cant });
    });

    // Si no usaste ningún insumo, avisamos (opcional)
    if (items.length === 0) {
        btn.disabled = false;
        btn.innerText = "DESCONTAR DEL EXCEL";
        return alert("No pusiste ninguna cantidad de insumos.");
    }

    await fetch(URL_SCRIPT, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify({ accion: "descontar", itemsADescontar: items, filaTurno: filaTurno })
    });
    alert("¡Stock y Turno actualizados!");
    location.reload();
}

        function reinicio() {
            document.getElementById('tamaño').value = "";
            document.getElementById('resultado').style.display = "none";
            document.getElementById('seccion-reserva').style.display = "none";
        }

// --- FUNCIÓN MÁGICA DE DESCARGA (html2canvas) ---
function descargarCotizacion() {
    const ticket = document.getElementById('tarjeta-downloadable');
    const btnDescarga = event.target;

    btnDescarga.innerText = "📸 Procesando...";
    btnDescarga.disabled = true;

    // Pequeño truco: Esperamos 100ms para que el navegador "dibuje" bien el ticket antes de la foto
    setTimeout(() => {
        html2canvas(ticket, {
            backgroundColor: "#000000",
            scale: 2, 
            useCORS: true, // Permite capturar imágenes de otros servidores
            allowTaint: true, // Ignora bloqueos de seguridad de píxeles si es necesario
            logging: false
        }).then(canvas => {
            const image = canvas.toDataURL("image/png");
            const link = document.createElement('a');
            link.href = image;
            link.download = `Cotizacion_Tattoo.png`;
            link.click();

            btnDescarga.innerText = "⬇️ DESCARGAR IMAGEN";
            btnDescarga.disabled = false;
        }).catch(err => {
            console.error("Error:", err);
            alert("No se pudo generar la imagen. ¡Saca una captura de pantalla!");
            btnDescarga.innerText = "⬇️ DESCARGAR IMAGEN";
            btnDescarga.disabled = false;
        });
    }, 100); 
}
        
    </script>
</body>
</html>
