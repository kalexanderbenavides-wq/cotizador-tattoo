<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALX.TATT | Cotizador Profesional</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Hairline&family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --negro-profundo: #0d0d0d;
            --gris-oscuro: #1a1a1a;
            --rojo-tinta: #e63946;
            --texto: #f1f1f1;
            --borde: #333;
        }

        /* --- RESET Y BASE --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--negro-profundo);
            color: var(--texto);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            padding: 20px;
            overflow-x: hidden;
        }

        /* --- ANIMACIONES --- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse-neon {
            0% { opacity: 0.4; text-shadow: 0 0 5px rgba(230, 57, 70, 0); }
            50% { opacity: 1; text-shadow: 0 0 15px rgba(230, 57, 70, 0.8); }
            100% { opacity: 0.4; text-shadow: 0 0 5px rgba(230, 57, 70, 0); }
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .main-container {
            max-width: 450px;
            margin: 0 auto;
            animation: fadeInUp 0.8s ease-out;
        }

        .card-cotizador {
            background: var(--gris-oscuro);
            padding: 25px;
            border-radius: 24px;
            border: 1px solid var(--borde);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            margin-bottom: 30px;
            transition: box-shadow 0.5s ease;
        }

        h1, h2 {
            color: var(--rojo-tinta);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        /* --- INPUTS Y FORMULARIO --- */
        .grupo-input { margin-bottom: 15px; }
        
        label {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 6px;
            display: block;
            text-transform: uppercase;
            font-weight: 700;
        }

        .input-pro {
            width: 100%;
            background: #000;
            border: 1px solid var(--borde);
            padding: 14px;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .input-pro:focus { border-color: var(--rojo-tinta); box-shadow: 0 0 10px rgba(230, 57, 70, 0.2); }

        /* --- BARRA DE PROGRESO --- */
        .progreso-container { margin-bottom: 20px; }
        .progreso-texto { font-size: 0.65rem; color: #666; margin-bottom: 5px; text-transform: uppercase; }
        .barra-fondo { width: 100%; height: 6px; background: #111; border-radius: 10px; overflow: hidden; border: 1px solid #222; }
        .barra-tinta { width: 0%; height: 100%; background: var(--rojo-tinta); box-shadow: 0 0 10px var(--rojo-tinta); transition: width 0.5s ease; }

        /* --- BOTONES --- */
        .btn-calc {
            background: var(--rojo-tinta);
            color: white;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 10px;
            transition: transform 0.2s;
        }
        .btn-calc:active { transform: scale(0.98); }

        /* --- RESULTADOS --- */
        #resultado {
            margin-top: 20px;
            text-align: center;
            font-weight: 800;
            font-size: 1.1rem;
            min-height: 30px;
        }

        .aviso-info {
            background: rgba(230, 57, 70, 0.1);
            border-left: 4px solid var(--rojo-tinta);
            padding: 10px;
            font-size: 0.8rem;
            margin-top: 15px;
            color: #ffb4b4;
        }

        /* --- GALERÍA GRID --- */
        .galeria-dinamica {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .ficha-galeria {
            position: relative;
            aspect-ratio: 1/1;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .ficha-galeria:hover {
            transform: translateY(-5px);
            border-color: var(--rojo-tinta);
            box-shadow: 0 0 15px rgba(230, 57, 70, 0.5);
        }

        .ficha-galeria img { width: 100%; height: 100%; object-fit: cover; }

        .info-estilo {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            padding: 10px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            display: flex; flex-direction: column;
        }

        .info-estilo span { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; color: #fff; }
        .small-counter { font-size: 0.55rem; color: var(--rojo-tinta); font-weight: 700; }

        /* --- CARRETE (OVERLAY) --- */
        .overlay-carrete {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            display: none; flex-direction: column;
        }

        .contenedor-slider {
            flex-grow: 1; display: flex;
            overflow-x: auto; scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }
        .contenedor-slider::-webkit-scrollbar { display: none; }

        .slide-item { min-width: 100%; display: flex; align-items: center; justify-content: center; scroll-snap-align: center; }
        .slide-item img { max-width: 90%; max-height: 75vh; object-fit: contain; }

        .nav-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.1); color: white; border: none;
            padding: 20px 10px; cursor: pointer; font-size: 1.5rem;
        }
        .arrow-left { left: 0; } .arrow-right { right: 0; }

        .btn-cerrar { position: absolute; top: 20px; right: 20px; font-size: 30px; color: white; cursor: pointer; z-index: 10000; }

        /* --- TOAST --- */
        .toast-aviso {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: #000; color: var(--rojo-tinta);
            padding: 12px 25px; border-radius: 50px; border: 2px solid var(--rojo-tinta);
            z-index: 10001; transition: top 0.5s ease; font-weight: 800; font-size: 0.8rem;
        }
        .toast-aviso.show { top: 20px; }

        /* --- PANEL ARTISTA --- */
        #panel-artista { background: #111; padding: 20px; border-radius: 15px; margin-top: 30px; border: 1px solid #222; }
    </style>
</head>
<body>

    <div id="toast-mensaje" class="toast-aviso">⚡ ESTILO SELECCIONADO</div>

    <div class="main-container">
        
        <div id="cotizador-seccion" class="card-cotizador">
            <div class="progreso-container">
                <div class="progreso-texto">Progreso: <span id="porcentaje-texto">0%</span></div>
                <div class="barra-fondo"><div id="barra-tinta" class="barra-tinta"></div></div>
            </div>

            <h1>ALX.TATT</h1>
            
            <div id="loader" style="display:none; text-align:center; margin-bottom: 20px;">
                <div style="animation: pulse-neon 1.5s infinite" class="small-counter">Sincronizando...</div>
            </div>

            <div class="grupo-input">
                <label>Estilo / Complejidad</label>
                <select id="complejidad" class="input-pro" onchange="calcular()">
                    <option value="1">Línea Fina / Minimalista</option>
                    <option value="1.5">Blackwork / Tradicional / Puntillismo</option>
                    <option value="2">Realismo / Neo tradicional / Full Color</option>
                </select>
            </div>

            <div class="grupo-input">
                <label>Zona del Cuerpo</label>
                <select id="zona-cuerpo" class="input-pro" onchange="calcular()">
                    <option value="1">Brazo / Pierna (Estándar)</option>
                    <option value="1.2">Espalda / Muslo (+20%)</option>
                    <option value="1.4">Costillas / Cuello / Abdomen (+40%)</option>
                    <option value="1.1">Mano / Pie / Muñeca (+10%)</option>
                </select>
            </div>

            <div class="grupo-input">
                <label>Tamaño (cm)</label>
                <input type="number" id="tamaño" class="input-pro" placeholder="Ej: 15" oninput="calcular()">
            </div>

            <div id="resultado">Ingresá los datos para cotizar</div>

            <div id="aviso-sesiones" class="aviso-info" style="display:none;">
                ⚠️ Este proyecto podría requerir más de una sesión.
            </div>

            <div id="seccion-reserva" style="display:none; margin-top: 25px;">
                <label>Nombre del Cliente</label>
                <input type="text" id="nombre-cliente" class="input-pro" placeholder="Tu nombre">
                <label>WhatsApp</label>
                <input type="tel" id="tel-cliente" class="input-pro" placeholder="Código + Número">
                <label>Horario Estimado</label>
                <select id="hora-turno" class="input-pro">
                    <option value="11:00">Mañana (11:00 AM)</option>
                    <option value="14:00">Tarde (02:00 PM)</option>
                    <option value="17:00">Tarde (05:00 PM)</option>
                </select>
                <button class="btn-calc" onclick="guardarTurno()" style="background: #25d366;">RESERVAR TURNO</button>
            </div>
        </div>

        <div class="galeria-container">
            <h2>Mis Trabajos</h2>
            <div id="galeria-dinamica" class="galeria-dinamica">
                <p style="grid-column: 1/-1; text-align:center; color:#444;">Cargando portfolio...</p>
            </div>
        </div>

        <button onclick="abrirPanelArtista()" style="background:none; border:none; color:#333; width:100%; margin-top:40px; cursor:pointer; font-size: 0.7rem;">⚙ ACCESO ARTISTA</button>
        <div id="panel-artista" style="display:none;">
            <h3>Gestión Interna</h3>
            <div id="lista-inventario"></div>
            <button class="btn-calc" onclick="enviarDescuentoStock()">Sincronizar Stock</button>
        </div>
    </div>

    <div id="overlay-carrete" class="overlay-carrete">
        <span class="btn-cerrar" onclick="cerrarCarrete()">&times;</span>
        <button class="nav-arrow arrow-left" onclick="moverSlider(-1)">&#10094;</button>
        <button class="nav-arrow arrow-right" onclick="moverSlider(1)">&#10095;</button>
        <div class="contenedor-slider" id="slider-fotos"></div>
        <div class="footer-carrete">
            <h3 id="titulo-carrete" style="color:white; margin-bottom:10px;">ESTILO</h3>
            <button id="btn-cotizar-carrete" class="btn-cotizar-pro">COTIZAR ESTE ESTILO</button>
        </div>
    </div>

    <script>
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxPt9JcsqYVTzYih1O_KBMHuwh4SmPRzVLzGSPIFQRij606SmFC2cGCPXUgTfyPui8-/exec";
        const MI_PIN = "1234";

        const mapaDificultad = {
            "linea fina": 1, "minimalista": 1,
            "blackwork": 1.5, "tradicional": 1.5, "puntillismo": 1.5,
            "realismo": 2.5, "neo tradicional": 2, "full color": 2
        };

        let datosCargados = { precios: {}, inventario: [], turnos: [], galeria: [] };
        let fotosPorEstilo = {};

        // --- CARGA INICIAL ---
        async function cargarDatos() {
            document.getElementById('loader').style.display = 'block';
            try {
                const res = await fetch(URL_SCRIPT + "?v=" + Date.now());
                const data = await res.json();
                datosCargados = data;
                dibujarGaleria(data.galeria);
            } catch (e) {
                console.error("Error:", e);
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }

        // --- GALERÍA Y CARRETE ---
        function dibujarGaleria(datos) {
            const contenedor = document.getElementById('galeria-dinamica');
            contenedor.innerHTML = "";
            fotosPorEstilo = {};

            datos.forEach(item => {
                if (!item.estilo) return;
                const key = item.estilo.trim();
                if (!fotosPorEstilo[key]) fotosPorEstilo[key] = [];
                fotosPorEstilo[key].push(item);
            });

            Object.keys(fotosPorEstilo).forEach(estilo => {
                const grupo = fotosPorEstilo[estilo];
                const portada = grupo.find(f => String(f.portada).toUpperCase() === "SI") || grupo[0];
                
                const ficha = document.createElement('div');
                ficha.className = "ficha-galeria";
                ficha.innerHTML = `
                    <img src="${portada.imagen}" alt="${estilo}">
                    <div class="info-estilo">
                        <span>${estilo}</span>
                        <small class="small-counter">${grupo.length} FOTOS • VER</small>
                    </div>
                `;
                ficha.onclick = () => abrirCarrete(estilo);
                contenedor.appendChild(ficha);
            });
        }

        function abrirCarrete(nombre) {
            const overlay = document.getElementById('overlay-carrete');
            const slider = document.getElementById('slider-fotos');
            const titulo = document.getElementById('titulo-carrete');
            const btn = document.getElementById('btn-cotizar-carrete');

            const fotos = fotosPorEstilo[nombre].sort((a,b) => (parseInt(a.orden) || 99) - (parseInt(b.orden) || 99));
            slider.innerHTML = "";
            fotos.forEach(f => {
                const div = document.createElement('div');
                div.className = "slide-item";
                div.innerHTML = `<img src="${f.imagen}">`;
                slider.appendChild(div);
            });

            titulo.innerText = nombre.toUpperCase();
            slider.scrollLeft = 0;
            overlay.style.display = "flex";
            document.body.style.overflow = "hidden";

            btn.onclick = () => {
                const sel = document.getElementById('complejidad');
                sel.value = mapaDificultad[nombre.toLowerCase().trim()] || 1.5;
                cerrarCarrete();
                
                // Mostrar Toast
                const toast = document.getElementById('toast-mensaje');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2500);

                setTimeout(() => {
                    document.getElementById('cotizador-seccion').scrollIntoView({ behavior: 'smooth' });
                    document.getElementById('tamaño').focus();
                    calcular();
                }, 300);
            };
        }

        function cerrarCarrete() {
            document.getElementById('overlay-carrete').style.display = "none";
            document.body.style.overflow = "auto";
        }

        function moverSlider(dir) {
            const s = document.getElementById('slider-fotos');
            s.scrollBy({ left: dir * s.clientWidth, behavior: 'smooth' });
        }

        // --- CÁLCULO Y PROGRESO ---
        function calcular() {
            const tam = parseFloat(document.getElementById('tamaño').value) || 0;
            const comp = parseFloat(document.getElementById('complejidad').value) || 1;
            const zona = parseFloat(document.getElementById('zona-cuerpo').value) || 1;
            const resDiv = document.getElementById('resultado');

            // Barra de progreso
            let puntos = 0;
            if (tam > 0) puntos++;
            if (comp > 0) puntos++;
            if (zona > 1) puntos++;
            const pct = Math.round((puntos/3)*100);
            document.getElementById('barra-tinta').style.width = pct + "%";
            document.getElementById('porcentaje-texto').innerText = pct + "%";

            if (tam > 0) {
                const base = comp >= 2 ? (datosCargados.precios.mediaAlta || 80000) : (datosCargados.precios.baja || 60000);
                let total = (base / 10) * tam * comp * zona;
                if (total < base) total = base;

                resDiv.innerHTML = `Presupuesto estimado: <span style="color:var(--rojo-tinta);">$${Math.round(total).toLocaleString()}</span>`;
                document.getElementById('aviso-sesiones').style.display = (tam >= 20) ? "block" : "none";
                document.getElementById('seccion-reserva').style.display = "block";
                resDiv.classList.add('glow-efecto');
                setTimeout(() => resDiv.classList.remove('glow-efecto'), 500);
            } else {
                resDiv.innerText = "Esperando tamaño...";
                document.getElementById('seccion-reserva').style.display = "none";
            }
        }

        // --- RESERVA Y WHATSAPP ---
        async function guardarTurno() {
            const n = document.getElementById('nombre-cliente').value;
            const w = document.getElementById('tel-cliente').value;
            if(!n || !w) return alert("Completá tus datos de contacto.");

            const msg = `Hola! Soy ${n}. Coticé un tattoo de ${document.getElementById('tamaño').value}cm. Mi presupuesto es ${document.getElementById('resultado').innerText}. Quiero agendar!`;
            window.location.href = `https://wa.me/5491157734552?text=${encodeURIComponent(msg)}`;
        }

        // --- ARTISTA ---
        function abrirPanelArtista() {
            if (prompt("PIN:") === MI_PIN) document.getElementById('panel-artista').style.display = "block";
        }

        window.addEventListener('DOMContentLoaded', cargarDatos);
    </script>
</body>
</html>
