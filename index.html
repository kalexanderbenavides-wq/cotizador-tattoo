<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALX.TAT | Cotizador Profesional</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Hairline&family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --negro-profundo: #0d0d0d;
            --gris-oscuro: #1a1a1a;
            --rojo-tinta: #e63946;
            --texto: #f1f1f1;
            --borde: #333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--negro-profundo);
            color: var(--texto);
            font-family: 'Inter', sans-serif;
            padding: 20px;
            overflow-x: hidden;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .main-container {
            max-width: 450px;
            margin: 0 auto;
            animation: fadeInUp 0.8s ease-out;
        }

        /* --- HEADER CON LOGO Y TÍTULO --- */
        .header-estudio {
            text-align: center;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-estudio img {
            max-width: 120px;
            height: auto;
            margin-bottom: 10px;
        }

        .header-estudio h1 {
            font-family: 'Bungee Hairline', sans-serif;
            font-size: 2.8rem;
            color: #fff;
            letter-spacing: 5px;
            line-height: 1;
        }

        /* --- TARJETA COTIZADOR --- */
        .card-cotizador {
            background: var(--gris-oscuro);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid var(--borde);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            margin-bottom: 30px;
        }

        h2 {
            color: var(--rojo-tinta);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 25px;
            font-size: 1rem;
        }

        /* --- BARRA DE PROGRESO --- */
        .progreso-container { margin-bottom: 25px; }
        .progreso-texto { font-size: 0.65rem; color: #666; margin-bottom: 8px; text-transform: uppercase; font-weight: 700; }
        .barra-fondo { width: 100%; height: 6px; background: #000; border-radius: 10px; overflow: hidden; border: 1px solid #222; }
        .barra-tinta { width: 0%; height: 100%; background: var(--rojo-tinta); box-shadow: 0 0 10px var(--rojo-tinta); transition: width 0.5s ease; }

        /* --- INPUTS --- */
        .grupo-input { margin-bottom: 20px; }
        label { font-size: 0.75rem; color: #888; margin-bottom: 8px; display: block; text-transform: uppercase; font-weight: 700; }
        
        .input-pro {
            width: 100%;
            background: #000;
            border: 1px solid var(--borde);
            padding: 16px;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        .input-pro:focus { border-color: var(--rojo-tinta); box-shadow: 0 0 15px rgba(230, 57, 70, 0.1); }

        /* --- BOTÓN PRO --- */
        .btn-calc {
            background: var(--rojo-tinta);
            color: white;
            width: 100%;
            padding: 20px;
            border-radius: 15px;
            border: none;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 1rem;
            letter-spacing: 1px;
            box-shadow: 0 10px 20px rgba(230, 57, 70, 0.3);
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .btn-calc:hover { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(230, 57, 70, 0.4); }
        .btn-calc:active { transform: scale(0.97); }

        #resultado {
            margin-top: 25px;
            text-align: center;
            font-weight: 800;
            font-size: 1.2rem;
            color: #fff;
        }

        .aviso-info {
            background: rgba(230, 57, 70, 0.1);
            border-left: 4px solid var(--rojo-tinta);
            padding: 12px;
            font-size: 0.8rem;
            margin-top: 20px;
            color: #ffb4b4;
            border-radius: 4px;
        }

        /* --- GALERÍA GRID --- */
        .galeria-dinamica {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
        }
        .ficha-galeria {
            position: relative;
            aspect-ratio: 1/1;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #222;
            cursor: pointer;
            transition: 0.3s ease;
        }
        .ficha-galeria:hover { border-color: var(--rojo-tinta); box-shadow: 0 0 20px rgba(230, 57, 70, 0.4); transform: translateY(-5px); }
        .ficha-galeria img { width: 100%; height: 100%; object-fit: cover; }
        .info-estilo {
            position: absolute; bottom: 0; left: 0; width: 100%;
            padding: 12px;
            background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
            display: flex; flex-direction: column;
        }
        .info-estilo span { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: #fff; }
        .small-counter { font-size: 0.6rem; color: var(--rojo-tinta); font-weight: 700; margin-top: 2px; }

        /* --- CARRETE --- */
        .overlay-carrete {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: none; flex-direction: column;
        }
        .contenedor-slider { flex-grow: 1; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
        .contenedor-slider::-webkit-scrollbar { display: none; }
        .slide-item { min-width: 100%; display: flex; align-items: center; justify-content: center; scroll-snap-align: center; }
        .slide-item img { max-width: 90%; max-height: 75vh; object-fit: contain; }
        .nav-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.05); color: white; border: none; padding: 30px 15px; cursor: pointer; font-size: 2rem; z-index: 10; }
        .arrow-left { left: 0; } .arrow-right { right: 0; }
        .btn-cerrar { position: absolute; top: 25px; right: 25px; font-size: 35px; color: white; cursor: pointer; z-index: 10000; }
        .footer-carrete { padding: 30px; background: linear-gradient(transparent, #000); text-align: center; }

        /* --- TOAST --- */
        .toast-aviso {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: #000; color: var(--rojo-tinta); padding: 15px 30px; border-radius: 50px;
            border: 2px solid var(--rojo-tinta); z-index: 10001; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-weight: 800; font-size: 0.8rem; text-transform: uppercase;
        }
        .toast-aviso.show { top: 30px; }
        /* --- ESTILOS VISUALIZADOR DE ESCALA --- */
.escala-wrapper {
    background: #000;
    border: 1px solid #222;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 20px;
    animation: fadeIn 0.4s ease;
}

.escala-header {
    display: flex;
    justify-content: space-between;
    font-size: 0.65rem;
    text-transform: uppercase;
    color: #666;
    margin-bottom: 15px;
}

#cm-display { color: var(--rojo-tinta); letter-spacing: 1px; }

.escala-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    overflow: hidden;
    padding: 10px 0;
}

.cuadro-tinta {
    width: 0px; 
    height: 0px;
    border: 2px solid var(--rojo-tinta);
    background: rgba(230, 57, 70, 0.1);
    box-shadow: 0 0 15px rgba(230, 57, 70, 0.4);
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
}

/* El "fantasma" de la tarjeta para comparar */
.referencia-fija {
    width: 85px; /* Proporción estándar de 8.5cm en pixeles aproximados */
    height: 54px;
    border: 1px dashed #444;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.55rem;
    color: #444;
}
    </style>
</head>
<body>

    <div id="toast-mensaje" class="toast-aviso">⚡ ESTILO SELECCIONADO</div>

    <div class="main-container">
        
        <header class="header-estudio">
            <img src="logo2026.png" alt="Logo Estudio">
            <h1>ALX.TAT</h1>
        </header>

        <div id="cotizador-seccion" class="card-cotizador">
            <div class="progreso-container">
                <div class="progreso-texto">Progreso de Reserva: <span id="porcentaje-texto">0%</span></div>
                <div class="barra-fondo"><div id="barra-tinta" class="barra-tinta"></div></div>
            </div>

            <h2>Cotizá tu Próximo Tattoo</h2>
            
            <div id="loader" style="display:none; text-align:center; margin-bottom: 20px;">
                <div style="font-size:0.7rem; color:var(--rojo-tinta); letter-spacing:2px;">CONECTANDO CON EL PORTFOLIO...</div>
            </div>

            <div class="grupo-input">
                <label>Elegí un Estilo</label>
                <select id="complejidad" class="input-pro" onchange="calcular()">
                    <option value="1">Línea Fina / Minimalista</option>
                    <option value="1.5">Blackwork / Tradicional / Puntillismo</option>
                    <option value="2">Realismo / Neo tradicional / Full Color</option>
                </select>
            </div>

            <div class="grupo-input">
                <label>Zona del Cuerpo</label>
                <select id="zona-cuerpo" class="input-pro" onchange="calcular()">
                    <option value="1">Brazo / Pierna</option>
                    <option value="1.2">Espalda / Muslo</option>
                    <option value="1.4">Costillas / Cuello / Abdomen</option>
                    <option value="1.1">Mano / Pie / Muñeca</option>
                </select>
            </div>

            <div class="grupo-input">
                <label>Tamaño aproximado (cm)</label>
                <input type="number" id="tamaño" class="input-pro" placeholder="Ej: 15" oninput="calcular()">
            </div>



            <div id="visualizador-escala" class="escala-wrapper" style="display:none;">
    <div class="escala-header">
        <span>Referencia de tamaño real:</span>
        <strong id="cm-display">0 cm</strong>
    </div>
    <div class="escala-stage">
        <div id="cuadro-referencia" class="cuadro-tinta"></div>
        <div class="referencia-fija">
            <span>💳 Tamaño Tarjeta</span>
        </div>
    </div>
</div>
            <div id="resultado">Esperando datos...</div>

            <div id="aviso-sesiones" class="aviso-info" style="display:none;">
                ⚠️ Este proyecto podría requerir más de una sesión.
            </div>

            <div id="seccion-reserva" style="display:none; margin-top: 30px; border-top: 1px dashed #333; padding-top: 25px;">
                <label>Tu Nombre</label>
                <input type="text" id="nombre-cliente" class="input-pro" placeholder="Nombre completo">
                <label>WhatsApp</label>
                <input type="tel" id="tel-cliente" class="input-pro" placeholder="Número con código de área">
                <label>Horario de Preferencia</label>
                <select id="hora-turno" class="input-pro">
                    <option value="11:00">Mañana (11:00 AM)</option>
                    <option value="14:00">Tarde (02:00 PM)</option>
                    <option value="17:00">Tarde (05:00 PM)</option>
                </select>
                <button class="btn-calc" onclick="guardarTurno()" style="background: #25d366; box-shadow: 0 10px 20px rgba(37, 211, 102, 0.2);">AGENDAR POR WHATSAPP</button>
            </div>
        </div>

        <div class="galeria-container">
            <h2 style="text-align: left; font-size: 0.9rem; margin-left: 10px;">Portfolio</h2>
            <div id="galeria-dinamica" class="galeria-dinamica"></div>
        </div>
        
        <button onclick="abrirPanelArtista()" style="background:none; border:none; color:#222; width:100%; margin-top:50px; cursor:pointer; font-size: 0.6rem;">⚙ ACCESO PRIVADO</button>
    </div>

    <div id="overlay-carrete" class="overlay-carrete">
        <span class="btn-cerrar" onclick="cerrarCarrete()">&times;</span>
        <button class="nav-arrow arrow-left" onclick="moverSlider(-1)">&#10094;</button>
        <button class="nav-arrow arrow-right" onclick="moverSlider(1)">&#10095;</button>
        <div class="contenedor-slider" id="slider-fotos"></div>
        <div class="footer-carrete">
            <h3 id="titulo-carrete" style="color:white; margin-bottom:15px; font-size: 1rem; letter-spacing: 2px;">ESTILO</h3>
            <button id="btn-cotizar-carrete" class="btn-calc">COTIZAR ESTE ESTILO</button>
        </div>
    </div>

    <script>
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxPt9JcsqYVTzYih1O_KBMHuwh4SmPRzVLzGSPIFQRij606SmFC2cGCPXUgTfyPui8-/exec";
        const MI_PIN = "1234";

        const mapaDificultad = {
            "linea fina": 1, "minimalista": 1,
            "blackwork": 1.5, "tradicional": 1.5, "puntillismo": 1.5,
            "realismo": 2.5, "neo tradicional": 2, "full color": 2
        };

        let datosCargados = { precios: {}, galeria: [] };
        let fotosPorEstilo = {};

        async function cargarDatos() {
            document.getElementById('loader').style.display = 'block';
            try {
                const res = await fetch(URL_SCRIPT + "?v=" + Date.now());
                const data = await res.json();
                datosCargados = data;
                dibujarGaleria(data.galeria);
            } catch (e) { console.error(e); } 
            finally { document.getElementById('loader').style.display = 'none'; }
        }

        function dibujarGaleria(datos) {
            const contenedor = document.getElementById('galeria-dinamica');
            contenedor.innerHTML = "";
            fotosPorEstilo = {};

            datos.forEach(item => {
                if (!item.estilo) return;
                const key = item.estilo.trim();
                if (!fotosPorEstilo[key]) fotosPorEstilo[key] = [];
                fotosPorEstilo[key].push(item);
            });

            Object.keys(fotosPorEstilo).forEach(estilo => {
                const grupo = fotosPorEstilo[estilo];
                const portada = grupo.find(f => String(f.portada).toUpperCase() === "SI") || grupo[0];
                
                const ficha = document.createElement('div');
                ficha.className = "ficha-galeria";
                ficha.innerHTML = `<img src="${portada.imagen}"><div class="info-estilo"><span>${estilo}</span><small class="small-counter">${grupo.length} TRABAJOS</small></div>`;
                ficha.onclick = () => abrirCarrete(estilo);
                contenedor.appendChild(ficha);
            });
        }

        function abrirCarrete(nombre) {
            const overlay = document.getElementById('overlay-carrete');
            const slider = document.getElementById('slider-fotos');
            const titulo = document.getElementById('titulo-carrete');
            const btn = document.getElementById('btn-cotizar-carrete');

            const fotos = fotosPorEstilo[nombre].sort((a,b) => (parseInt(a.orden) || 99) - (parseInt(b.orden) || 99));
            slider.innerHTML = "";
            fotos.forEach(f => {
                const div = document.createElement('div');
                div.className = "slide-item";
                div.innerHTML = `<img src="${f.imagen}">`;
                slider.appendChild(div);
            });

            titulo.innerText = nombre.toUpperCase();
            slider.scrollLeft = 0;
            overlay.style.display = "flex";
            document.body.style.overflow = "hidden";

            btn.onclick = () => {
                document.getElementById('complejidad').value = mapaDificultad[nombre.toLowerCase().trim()] || 1.5;
                cerrarCarrete();
                const toast = document.getElementById('toast-mensaje');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2500);

                setTimeout(() => {
                    document.getElementById('cotizador-seccion').scrollIntoView({ behavior: 'smooth' });
                    document.getElementById('tamaño').focus();
                    calcular();
                }, 400);
            };
        }

        function cerrarCarrete() { document.getElementById('overlay-carrete').style.display = "none"; document.body.style.overflow = "auto"; }
        function moverSlider(dir) { const s = document.getElementById('slider-fotos'); s.scrollBy({ left: dir * s.clientWidth, behavior: 'smooth' }); }

        function calcular() {
    const tam = parseFloat(document.getElementById('tamaño').value) || 0;
            const comp = parseFloat(document.getElementById('complejidad').value) || 1;
            const zona = parseFloat(document.getElementById('zona-cuerpo').value) || 1;
            const resEscala = document.getElementById('visualizador-escala');
    const cuadro = document.getElementById('cuadro-referencia');
    const textCm = document.getElementById('cm-display');
            
            let puntos = 0; if (tam > 0) puntos++; if (comp > 0) puntos++; if (zona > 1) puntos++;
            const pct = Math.round((puntos/3)*100);
            document.getElementById('barra-tinta').style.width = pct + "%";
            document.getElementById('porcentaje-texto').innerText = pct + "%";

            const resDiv = document.getElementById('resultado');
            if (tam > 0) {
                // --- LÓGICA DE ESCALA ---
        resEscala.style.display = "block";
        textCm.innerText = tam + " CM";
        
        // Factor de conversión aproximado: 1cm = 10px en pantalla móvil estándar
        // Usamos un factor que se vea bien pero no rompa la pantalla
        let pxSize = tam * 10; 
        
        cuadro.style.width = pxSize + "px";
        cuadro.style.height = pxSize + "px";
                
                const base = comp >= 2 ? (datosCargados.precios.mediaAlta || 80000) : (datosCargados.precios.baja || 65000);
                let total = (base / 10) * tam * comp * zona;
                if (total < base) total = base;

                resDiv.innerHTML = `Presupuesto Estimado: <span style="color:var(--rojo-tinta);">$${Math.round(total).toLocaleString()}</span>`;
                document.getElementById('aviso-sesiones').style.display = (tam >= 22) ? "block" : "none";
                document.getElementById('seccion-reserva').style.display = "block";
            } else {
                resDiv.innerText = "Ingresá el tamaño";
                document.getElementById('seccion-reserva').style.display = "none";
            }
        }

        async function guardarTurno() {
            const n = document.getElementById('nombre-cliente').value;
            const w = document.getElementById('tel-cliente').value;
            if(!n || !w) return alert("Por favor, completá tu contacto.");
            const msg = `Hola Alex! Soy ${n}. Coticé un tattoo de ${document.getElementById('tamaño').value}cm. Mi presupuesto estimado es ${document.getElementById('resultado').innerText}. Me gustaría agendar!`;
            window.location.href = `https://wa.me/5491157734552?text=${encodeURIComponent(msg)}`;
        }

        function abrirPanelArtista() { if (prompt("PIN:") === MI_PIN) alert("Acceso concedido."); }

        window.addEventListener('DOMContentLoaded', cargarDatos);
    </script>
</body>
</html>
