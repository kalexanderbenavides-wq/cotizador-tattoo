<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        :root {
            --negro-profundo: #0d0d0d;
            --gris-oscuro: #1a1a1a;
            --rojo-tinta: #e63946;
            --texto: #f1f1f1;
            --borde: #333;
        }

        body {
            background-color: var(--negro-profundo);
            color: var(--texto);
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: var(--gris-oscuro);
            padding: 30px;
            border-radius: 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid var(--borde);
        }

        h1 {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 30px;
            color: var(--rojo-tinta);
        }

        label {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 8px;
            display: block;
        }

        input, select {
            width: 100%;
            background: #111;
            border: 1px solid var(--borde);
            padding: 15px;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            margin-bottom: 20px;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--rojo-tinta); }

        .btn-calc {
            background: var(--rojo-tinta);
            color: white;
            width: 100%;
            padding: 18px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(230, 57, 70, 0.3);
        }

        .btn-reset {
            background: transparent;
            color: #666;
            margin-top: 15px;
            width: 100%;
            border: none;
            font-size: 0.9rem;
            cursor: pointer;
        }

        # {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px dashed var(--borde);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .inv-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            align-items: center;
            background: #111;
            padding: 10px;
            border-radius: 10px;
        }

        /* --- ESTILOS DE GALERÍA OPTIMIZADOS --- */
        .galeria-container {
            margin-top: 40px;
            text-align: center;
        }

        .galeria-flex {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            padding: 10px;
        }

        .foto-placeholder {
            width: 140px;
            height: 180px;
            background: #111;
            border: 1px solid var(--borde);
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            transition: 0.3s ease;
            cursor: pointer;
        }

        .foto-placeholder:hover {
            border-color: var(--rojo-tinta);
            transform: translateY(-8px);
            box-shadow: 0 0 15px rgba(230, 57, 70, 0.4);
        }

        .foto-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.3s;
        }

        .foto-placeholder span {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            padding: 15px 10px 10px;
            color: white;
            font-size: 0.65rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
            z-index: 2;
        }
/* --- NUEVOS ESTILOS PARA LA TARJETA INSTAGRAMEABLE --- */

/* Contenedor principal del Ticket */
.ticket-quote {
    background: #000000; /* Negro profundo para máximo contraste */
    padding: 30px;
    border-radius: 20px;
    /* Borde fino y minimalista inspirado en la opción Minimal (ahora blanco) */
    border: 1px solid #ffffff; 
    text-align: center;
    position: relative;
    margin-top: 20px;
    box-sizing: border-box; /* Asegura que el padding no rompa el borde */
}

/* 2. TEXTO GENERAL: Todo blanco */
.ticket-quote,
.ticket-quote span,
.ticket-details,
.ticket-footer {
    color: #ffffff; /* Forzamos color blanco en todo el ticket */
    font-family: 'Inter', sans-serif;
}

/* 3. EL PRECIO: Único elemento Rojo con Brillo Neón */
.ticket-price {
    font-family: 'Bungee Hairline', sans-serif;
    font-size: 4rem; /* ¡Más grande! */
    font-weight: 400;
    margin: 10px 0;
    line-height: 1;
    
    /* CAMBIO CLAVE: Color Rojo Neón Tinta */
    color: var(--rojo-tinta);
    /* Efecto Neón Rojo Triple (más profundo) */
    text-shadow: 0 0 10px rgba(230, 57, 70, 0.7), 
                0 0 20px rgba(230, 57, 70, 0.5);
}

/* 4. DETALLES (Estilo y Tamaño): Blanco y Nítido */
.ticket-details {
    text-transform: uppercase;
    letter-spacing: 4px;
    font-size: 0.7rem;
    margin-top: 10px;
    font-weight: 700;
}

/* 5. EL DIVISOR: Línea punteada blanca y fina */
.ticket-divider {
    border: none;
    border-top: 1px dashed #ffffff; /* Ahora blanca y fina */
    margin: 25px 0;
}

/* 6. PIE DE TICKET: Blanco y nítido */
.ticket-footer {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 2px;
}

/* Botones dentro de la tarjeta al cotizar */
.btn-ticket-group {
    margin-top: 25px;
    display: flex;
    gap: 10px;
    justify-content: center;
}

.btn-download {
    background: #ffffff; /* Blanco para contrastar */
    color: #000000;
    padding: 10px 20px;
    border-radius: 50px;
    font-size: 0.7rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: 0.3s;
}
.btn-download:hover { background: #cccccc; }

/* --- ANIMACIÓN DEL LOADER --- */
.pulse-text {
    font-family: 'Inter', sans-serif;
    font-size: 0.7rem;
    letter-spacing: 4px;
    color: var(--rojo-tinta);
    font-weight: 700;
    text-transform: uppercase;
    /* Animación de palpitación */
    animation: pulse-neon 1.5s infinite ease-in-out;
}

@keyframes pulse-neon {
    0% { opacity: 0.4; text-shadow: 0 0 5px rgba(230, 57, 70, 0); }
    50% { opacity: 1; text-shadow: 0 0 15px rgba(230, 57, 70, 0.8); }
    100% { opacity: 0.4; text-shadow: 0 0 5px rgba(230, 57, 70, 0); }
}        


/* --- ESTILOS CARRETE INSTAGRAM --- */
.overlay-carrete {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000;
    z-index: 3000;
    display: flex;
    flex-direction: column;
}

.contenedor-slider {
    flex-grow: 1;
    display: flex;
    overflow-x: auto; /* Habilita el scroll horizontal */
    scroll-snap-type: x mandatory; /* Efecto imán de Instagram */
    scrollbar-width: none; /* Esconde barra en Firefox */
}
.contenedor-slider::-webkit-scrollbar { display: none; } /* Esconde barra en Chrome */

.slide-item {
    min-width: 100%;
    height: 100%;
    scroll-snap-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
}

.slide-item img {
    max-width: 100%;
    max-height: 80vh;
    object-fit: contain;
}

.footer-carrete {
    padding: 20px;
    background: linear-gradient(transparent, #000);
    text-align: center;
    color: white;
}

.btn-cotizar-pro {
    background: var(--rojo-tinta);
    color: white;
    padding: 15px 40px;
    border-radius: 50px;
    border: none;
    font-weight: 700;
    text-transform: uppercase;
    margin-top: 10px;
    cursor: pointer;
}

.btn-cerrar {
    position: absolute;
    top: 20px; right: 20px;
    color: white; font-size: 40px; z-index: 3001;
}

/* --- ESTILOS DE LA CUADRÍCULA PRINCIPAL (GRID) --- */
#galeria-dinamica {
    display: grid !important; /* Forzamos el modo grilla */
    grid-template-columns: repeat(2, 1fr) !important; /* 2 columnas fijas en celu */
    gap: 10px;
    padding: 15px;
    min-height: 300px; /* Le damos altura mínima para que no sea 'invisible' */
    width: 100%;
    box-sizing: border-box;
}

@media (min-width: 768px) {
    .galeria-dinamica {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
    }
}
        
/* La ficha (tarjeta) de cada estilo */
.ficha-galeria {
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Movimiento más elástico */
    border: 1px solid #222;
}

/* --- ANIMACIÓN AL PASAR EL CURSOR (HOVER) --- */
.ficha-galeria:hover {
    transform: translateY(-8px) scale(1.02); /* Sube un poco más y se agranda */
    border-color: var(--rojo-tinta);
    /* Brillo Neón: Sombra externa roja + Sombra interna sutil */
    box-shadow: 0 0 20px rgba(230, 57, 70, 0.6), 
                inset 0 0 10px rgba(230, 57, 70, 0.4);
    z-index: 10;
}

/* La foto de portada dentro de la ficha */
.ficha-galeria img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* La foto llena el cuadrado sin deformarse */
}

/* Animación de Zoom en la foto al pasar el cursor */
.ficha-galeria:hover img {
    transform: scale(1.1); /* Agranda la foto un 10% */
}

/* --- DETALLES DE INFORMACIÓN SOBRE LA FOTO --- */
.info-estilo {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 20px 10px 10px;
    background: linear-gradient(to top, rgba(0,0,0,0.9) 30%, transparent);
    display: flex;
    flex-direction: column; /* Texto uno arriba del otro */
    align-items: flex-start;
}

./* Ajuste para que los textos no se pisen en pantallas chicas */
.info-estilo span {
    font-size: 0.7rem !important;
    white-space: normal !important; /* Que pueda usar dos renglones si es necesario */
    line-height: 1.1;
}

/* --- INDICADOR DE 'MÁS FOTOS' (El cue visual) --- */
.small-counter {
    font-size: 0.6rem;
    color: var(--rojo-tinta);
    margin-top: 2px;
}

/* --- CARRETE: FLECHAS PC Y SNAP --- */
.contenedor-slider {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth; /* Desplazamiento suave */
}

.slide-item {
    min-width: 100%;
    scroll-snap-align: center;
    scroll-snap-stop: always; /* EVITA QUE SE PASEN 2 FOTOS */
    display: flex;
    justify-content: center;
}

/* Flechas para PC */
.nav-arrow {
    display: none; /* Escondidas en celular */
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.1);
    color: white;
    border: none;
    font-size: 2rem;
    padding: 20px 10px;
    cursor: pointer;
    z-index: 3100;
}
@media (min-width: 768px) { .nav-arrow { display: block; } }
.arrow-left { left: 10px; }
.arrow-right { right: 10px; }

.btn-cotizar-pro:active {
    transform: scale(0.95); /* Se achica un poquito al tocarlo */
    background-color: #b51d28; /* Se oscurece el rojo */
}

/* Animación para que el formulario "brille" al ser seleccionado */
.card-cotizador {
    transition: box-shadow 0.5s ease;
}
        
.toast-aviso {
    position: fixed;
    top: -100px; /* Escondido arriba */
    left: 50%;
    transform: translateX(-50%);
    background: #000;

    padding: 15px 30px;
    border: 2px solid var(--rojo-tinta);
    border-radius: 50px;
    font-weight: 800;
    letter-spacing: 2px;
    z-index: 9999;

}

.toast-aviso.show {
    top: 20px; /* Aparece en pantalla */
}

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
</head>
<body>

<div id="toast-mensaje" class="toast-aviso">⚡ ESTILO SELECCIONADO</div>
    
    <div class="card">
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="logo2026.png" alt="Logo Estudio" style="max-width: 120px; height: auto;">
        </div>
        <h1>Cotizador Estudio</h1>
        
        <label>Tamaño (5cm - 50cm):</label>
        <input type="number" id="tamaño" placeholder="Ej: 15" min="5" max="50">

        <label>Complejidad / Estilo:</label>
        <select id="complejidad">
            <option value="1">Baja (Solo líneas)</option>
            <option value="1.5">Media (Sombras / Detalle)</option>
            <option value="2">Alta (Realismo / Full Color)</option>
        </select>

        <div class="btn-group">
            <button class="btn-calc" onclick="calcular()">COTIZAR</button>
            <button class="btn-reset" onclick="reinicio()">LIMPIAR</button>
        </div>

        <div id="loader" style="display:none; text-align:center; margin: 20px 0;">
    <div class="pulse-text">ALX.TATT • PROCESANDO...</div>
</div>

<div id="resultado" style="display:none;"></div>
        <div id="seccion-reserva" style="display:none; margin-top:20px;">
            <label>Elegí tu horario:</label>
            <select id="hora-turno">
                <option value="11:00">Mañana (11:00 AM)</option>
                <option value="14:00">Tarde 1 (02:00 PM)</option>
                <option value="17:00">Tarde 2 (05:00 PM)</option>
            </select>
            
            <label>Tu Nombre:</label>
            <input type="text" id="nombre-cliente" placeholder="Nombre completo">
            <label>WhatsApp (con código de país):</label>
<input type="tel" id="tel-cliente" placeholder="Ej: 5491123456789">
            
            <button class="btn-calc" onclick="guardarTurno()" style="background: #25d366;">RESERVAR TURNO</button>
        </div>
        
        <div class="galeria-container">
            <h2>Mis Trabajos</h2>
            <div id="galeria-dinamica" class="galeria-flex">
                <p style="color:#444;">Sincronizando portfolio...</p>
            </div>
        </div>
        
        <hr style="margin-top:50px; border: 0.5px solid #333;">
        <button onclick="abrirPanelArtista()" style="background:none; border:none; color:#444; width:100%; cursor:pointer;">⚙ Acceso Artista</button>

        <div id="panel-artista" style="display:none; background:#111; padding:20px; border-radius:15px; margin-top:20px;">
            <h3>Gestión de Insumos</h3>
            <div id="lista-inventario"></div>
            <button class="btn-calc" onclick="enviarDescuentoStock()" style="margin-top:20px; background:#444;">DESCONTAR DEL EXCEL</button>
        </div>
    </div>

    <script>
        // --- VARIABLES DE ESTADO ---
        let datosCargados = { precios: {}, inventario: [], turnos: [], galeria: [] };
        let totalCalculado = 0;
        let estiloNombre = ""; 
        let cargando = false; 
        const MI_PIN = "1234"; 
        
        // --- TU URL REAL ---
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxPt9JcsqYVTzYih1O_KBMHuwh4SmPRzVLzGSPIFQRij606SmFC2cGCPXUgTfyPui8-/exec";

        // 1. CARGAR DATOS DESDE EL EXCEL
        async function cargarDatos() {
    if (cargando) return;
    cargando = true;
    
    // 1. PRENDEMOS EL LOADER (Se ve apenas entra el cliente)
    document.getElementById('loader').style.display = 'block';
    
    try {
        const res = await fetch(URL_SCRIPT + "?v=" + Date.now());
        const data = await res.json();
        
        datosCargados = {
            precios: data.precios || {},
            inventario: data.inventario || [],
            turnos: data.turnos || [],
            galeria: data.galeria || []
        };

        dibujarGaleria(datosCargados.galeria);

    } catch (e) {
        console.error("Error sincronizando:", e);
        document.getElementById('galeria-dinamica').innerHTML = "<p style='color:red;'>Error de conexión.</p>";
    } finally {
        cargando = false;
        // 2. APAGAMOS EL LOADER (Cuando ya tenemos los datos listos)
        document.getElementById('loader').style.display = 'none';
    }
}

        // 2. DIBUJAR LA GALERÍA DINÁMICAMENTE
        // 1. MEJORA: Galería Interactiva
// Variable global para guardar las fotos agrupadas
// Variable global para guardar las fotos agrupadas
let fotosPorEstilo = {};

function dibujarGaleria(datos) {
    // ESTO ES CLAVE: Si estás en el celu, te va a tirar un cartelito
    // Solo para probar. Si aparece el cartel, es que los datos LLEGARON.
    if (!datos || datos.length === 0) {
        console.error("No llegaron fotos");
        return;
    }

    const contenedor = document.getElementById('galeria-dinamica');
    if (!contenedor) {
        alert("Error: No encontré el contenedor 'galeria-dinamica' en el HTML");
        return;
    }

    contenedor.innerHTML = "";
    fotosPorEstilo = {}; // Limpiamos la variable global

    // 1. AGRUPAR: Convertimos la lista plana en "cajas" por estilo
    datos.forEach(item => {
        if (!item.estilo) return; // Salta filas vacías
        const nombreLimpio = item.estilo.trim(); 
        if (!fotosPorEstilo[nombreLimpio]) {
            fotosPorEstilo[nombreLimpio] = [];
        }
        fotosPorEstilo[nombreLimpio].push(item);
    });

    // 2. DIBUJAR PORTADAS EN EL GRID
    Object.keys(fotosPorEstilo).forEach(nombreEstilo => {
        const grupo = fotosPorEstilo[nombreEstilo];
        
        // Buscamos la portada ("SI"), si no hay, usamos la primera
        const portada = grupo.find(f => String(f.portada).toUpperCase() === "SI") || grupo[0];

        // Creamos la ficha (card) que recibirá el CSS
        const ficha = document.createElement('div');
        ficha.className = "ficha-galeria";
        
        // Aquí armamos el HTML que va ADENTRO de cada tarjeta
        ficha.innerHTML = `
            <img src="${portada.imagen}" alt="${nombreEstilo}" loading="lazy">
            <div class="info-estilo">
                <span>${nombreEstilo}</span>
                <small class="small-counter">${grupo.length} FOTOS • VIEW</small>
            </div>
        `;

        // Al tocar, se abre el carrete (esto ya funcionaba)
        ficha.onclick = () => abrirCarrete(nombreEstilo);
        
        contenedor.appendChild(ficha);
    });
}

        // 3. INICIO AUTOMÁTICO
        window.addEventListener('DOMContentLoaded', cargarDatos);

        // --- FUNCIONES DE CÁLCULO Y RESERVA ---
        async function calcular() {
    const tam = parseFloat(document.getElementById('tamaño').value);
    const selector = document.getElementById('complejidad');
    const comp = parseFloat(selector.value);
    
    // Validación rápida antes de mostrar carga
    if (isNaN(tam) || tam < 5) return alert("⚠️ Ingresá un tamaño válido (mín. 5cm)");

    // 1. ESCONDEMOS EL TICKET ANTERIOR Y PRENDEMOS EL LOADER
    document.getElementById('resultado').style.display = 'none';
    document.getElementById('loader').style.display = 'block';

    // 2. ESPERAMOS 500ms (Efecto de "procesamiento" pro)
    setTimeout(() => {
        let fullText = selector.options[selector.selectedIndex].text;
        let match = fullText.match(/\(([^)]+)\)/);
        estiloNombre = match ? match[1] : fullText;

        const precios = datosCargados.precios;
        let base = (comp == 1) ? precios.baja : precios.mediaAlta;
        let extra = (tam < 15) ? 0 : Math.ceil((tam - 15) / 5) * 40000;
        totalCalculado = base + extra;

        const resDiv = document.getElementById('resultado');
        
        // Dibujamos el Ticket Cyber-Minimal
        resDiv.innerHTML = `
            <div id="tarjeta-downloadable" class="ticket-quote">
                <img src="logo2026.png" style="width: 60px; margin-bottom:10px;">
                <div style="font-size:0.65rem; color:#ffffff; text-transform:uppercase; letter-spacing:2px; font-weight:700;">
                    ALX.TATT ESTUDIO
                </div>
                <h2 class="ticket-price">$${totalCalculado.toLocaleString()}</h2>
                <p class="ticket-details">${estiloNombre} • ${tam}CM</p>
                <hr class="ticket-divider">
                <div class="ticket-footer">
                    ALX.TATT ESTUDIO • VILLA DEL PARQUE<br>
                    VÁLIDO POR 30 DÍAS • SUJETO A CAMBIOS
                </div>
            </div>
            <div class="btn-ticket-group" style="margin-top: 25px;">
                <button onclick="descargarCotizacion()" class="btn-download">⬇️ DESCARGAR IMAGEN</button>
            </div>
        `;
        
        // 3. APAGAMOS LOADER Y MOSTRAMOS EL RESULTADO FINAL
        document.getElementById('loader').style.display = 'none';
        resDiv.style.display = "block";
        document.getElementById('seccion-reserva').style.display = "block";
        
    }, 500); // Fin del tiempo de espera
}

        function prepararCaptura() {
            document.getElementById('btn-foto').style.display = 'none';
            document.getElementById('seccion-reserva').style.display = 'none';
            alert("¡Lista para captura! Tocá cualquier lado para volver.");
            window.onclick = function() {
                document.getElementById('btn-foto').style.display = 'inline-block';
                document.getElementById('seccion-reserva').style.display = 'block';
                window.onclick = null;
            };
        }

        async function guardarTurno() {
    const nombre = document.getElementById('nombre-cliente').value.trim();
    const whatsapp = document.getElementById('tel-cliente').value.trim();
    const tam = document.getElementById('tamaño').value;
    const hora = document.getElementById('hora-turno').value;

    // --- EL GUARDIA INTERNACIONAL (Ponerlo aquí) ---
    if (!nombre) return alert("⚠️ Por favor, ingresá tu nombre.");

    // Acepta de 7 a 15 números (estándar mundial)
    const moldeInternacional = /^\d{7,15}$/; 
    if (!moldeInternacional.test(whatsapp)) {
        return alert("⚠️ WhatsApp inválido. Poné solo números con código de país (ej: 54911...)");
    }

    // --- EL ENVÍO (Sigue igual) ---
    try {
        await fetch(URL_SCRIPT, {
            method: 'POST',

        // 2. MEJORA: Validación de Seguridad (Capa de Protección)
async function enviarDescuentoStock() {
    const filaTurno = document.getElementById('select-turno').value;
    
    // --- EL CANDADO ---
    if (!filaTurno) {
        return alert("⚠️ ERROR: Tenés que seleccionar qué cliente terminó para poder descontar el stock.");
    }

    const btn = event.target;
    btn.innerText = "Sincronizando...";
    btn.disabled = true;

    let items = [];
    datosCargados.inventario.forEach((item, i) => {
        let cant = parseInt(document.getElementById(`inv-${i}`).value);
        if(cant > 0) items.push({ fila: item.fila, cantidad: cant });
    });

    // Si no usaste ningún insumo, avisamos (opcional)
    if (items.length === 0) {
        btn.disabled = false;
        btn.innerText = "DESCONTAR DEL EXCEL";
        return alert("No pusiste ninguna cantidad de insumos.");
    }

    await fetch(URL_SCRIPT, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify({ accion: "descontar", itemsADescontar: items, filaTurno: filaTurno })
    });
    alert("¡Stock y Turno actualizados!");
    location.reload();
}

// --- FUNCIÓN MÁGICA DE DESCARGA (html2canvas) ---
function descargarCotizacion() {
    const ticket = document.getElementById('tarjeta-downloadable');
    const btnDescarga = event.target;

    btnDescarga.innerText = "📸 Procesando...";
    btnDescarga.disabled = true;

    // Pequeño truco: Esperamos 100ms para que el navegador "dibuje" bien el ticket antes de la foto
    setTimeout(() => {
        html2canvas(ticket, {
            backgroundColor: "#000000",
            scale: 2, 
            useCORS: true, // Permite capturar imágenes de otros servidores
            allowTaint: true, // Ignora bloqueos de seguridad de píxeles si es necesario
            logging: false
        }).then(canvas => {
            const image = canvas.toDataURL("image/png");
            const link = document.createElement('a');
            link.href = image;
            link.download = `Cotizacion_Tattoo.png`;
            link.click();

            btnDescarga.innerText = "⬇️ DESCARGAR IMAGEN";
            btnDescarga.disabled = false;
        }).catch(err => {
            console.error("Error:", err);
            alert("No se pudo generar la imagen. ¡Saca una captura de pantalla!");
            btnDescarga.innerText = "⬇️ DESCARGAR IMAGEN";
            btnDescarga.disabled = false;
        });
    }, 100); 
}

function abrirCarrete(nombreEstilo) {
    const overlay = document.getElementById('overlay-carrete');
    const slider = document.getElementById('slider-fotos');
    const titulo = document.getElementById('titulo-carrete');
    const btnCotizar = document.getElementById('btn-cotizar-carrete');

    const fotos = fotosPorEstilo[nombreEstilo];
    
    // 1. Ordenamos fotos
    fotos.sort((a, b) => (parseInt(a.orden) || 99) - (parseInt(b.orden) || 99));

    // 2. Limpiamos y cargamos
    slider.innerHTML = "";
    fotos.forEach(f => {
        const item = document.createElement('div');
        item.className = "slide-item";
        item.innerHTML = `<img src="${f.imagen}" style="max-height:80vh; max-width:90%;">`;
        slider.appendChild(item);
    });

    titulo.innerText = nombreEstilo.toUpperCase();
    slider.scrollLeft = 0; 
    overlay.style.display = "flex";
    document.body.style.overflow = "hidden";

    // --- AQUÍ ESTÁ LA MAGIA: EL BOTÓN DE ACCIÓN ---
    btnCotizar.onclick = () => {
        const selector = document.getElementById('complejidad');
        
        // 1. Buscamos el estilo en el menú
        let opcionEncontrada = false;
        for (let i = 0; i < selector.options.length; i++) {
            if (selector.options[i].text.toLowerCase().includes(nombreEstilo.toLowerCase())) {
                selector.selectedIndex = i;
                opcionEncontrada = true;
                break;
            }
        }
        if (!opcionEncontrada) selector.value = "1.5";

        // 2. Cerramos el carrete
        cerrarCarrete();

        // 3. MOSTRAR EL MENSAJE FLOTANTE
        const toast = document.getElementById('toast-mensaje');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);

        // 4. EL VUELO (SCROLL) FORZADO
        // Intentamos ir al principio de la página
        window.scrollTo({ top: 0, behavior: 'smooth' });

        // Backup por si el 'smooth' falla en algún celular:
        setTimeout(() => {
            // Hacemos foco en el tamaño para que el teclado se abra (UX Pro)
            const inputTam = document.getElementById('tamaño');
            inputTam.focus();
            
            // Si después de medio segundo no llegó arriba, lo forzamos
            if (window.scrollY > 200) {
                window.scrollTo(0, 0);
            }
        }, 700);
    };
}

// NUEVA FUNCIÓN PARA LAS FLECHAS PC
function moverSlider(direccion) {
    const slider = document.getElementById('slider-fotos');
    const anchoFoto = slider.clientWidth;
    slider.scrollBy({ left: direccion * anchoFoto, behavior: 'smooth' });
}

function cerrarCarrete() {
    document.getElementById('overlay-carrete').style.display = "none";
    document.body.style.overflow = "auto";
}
